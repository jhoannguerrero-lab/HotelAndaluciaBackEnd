spring.application.name=backend
server.port=8080

# --- Conexion a MySQL/MariaDB ---
# Ajusta usuario/contrasena segun tu instalacion local.
# La base de datos "hotel_andalucia" debe existir antes de correr la app:
#   CREATE DATABASE hotel_andalucia;
spring.datasource.url=jdbc:mysql://localhost:3306/hotel_andalucia?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# --- JPA / Hibernate ---
# update: crea/actualiza las tablas automaticamente a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Carga de datos de ejemplo (data.sql) ---
# defer-datasource-initialization=true asegura que Hibernate cree las tablas
# ANTES de que se ejecute data.sql (si no, fallaria por tablas inexistentes).
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# --- JWT ---
# Clave secreta usada para firmar los tokens (Base64, 512 bits).
# En un proyecto real esto NO se sube a Git; aqui va directo por
# simplicidad academica. Si quieres, muevelo a una variable de entorno.
jwt.secret=RtStsBx9fEegxfRdNzkDpu4DVgvlIndojhlsZ2EDbXtMbB412ezg6CNMC5B0fGNvQrd/o8B0KeIwkblhdY5HCw==
# Expiracion del token en milisegundos (24 horas)
